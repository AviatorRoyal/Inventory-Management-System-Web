<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Shree Dwarka Agency</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #dbeafe, #fef9c3);
            min-height: 100vh;
        }

        .title-container {
            text-align: center;
            padding: 30px 20px 10px 20px;
        }

        .title-container h1 {
            font-size: 2.5rem;
            color: #1e3a8a;
            margin-bottom: 0.2em;
        }

        .title-container h2 {
            font-size: 1.5rem;
            color: #475569;
            font-weight: 400;
            margin-top: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
            border-radius: 15px;
            padding: 30px;
            margin: 15px 0;
            width: 90%;
            max-width: 700px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 20px;
            font-size: 1.6rem;
            color: #1e293b;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
        }

        .button-link {
            padding: 12px 24px;
            background-color: #1d4ed8;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .button-link:hover {
            background-color: #1e40af;
        }

        @media (max-width: 600px) {
            .card {
                padding: 20px;
            }

            .title-container h1 {
                font-size: 2rem;
            }

            .title-container h2 {
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>Shree Dwarka Agency</h1>
        <h2>Inventory Management System</h2>
    </div>

    <div class="container">
        <div class="card">
            <h3>Dashboard</h3>
            <p>Welcome, {{ session['fullname'] }}</p>
            <div class="button-group">
                {% if session.level in ['Admin', 'Write'] %}
                    <a href="{{ url_for('add_item') }}" class="button-link">➕ Add Item</a>
                    <a href="{{ url_for('incoming') }}" class="button-link">📥 Incoming Stock</a>
                    <a href="{{ url_for('outgoing') }}" class="button-link">📤 Outgoing Stock</a>
                {% endif %}
                
                <a href="{{ url_for('items') }}" class="button-link">📦 View Items</a>

                {% if session.level == 'Admin' %}
                    <a href="{{ url_for('manage_users') }}" class="button-link">👥 Manage Users</a>
                {% endif %}

                <a href="{{ url_for('do_logout') }}" class="button-link" style="background-color:#e11d48;">🚪 Logout</a>
            </div>
        </div>
    </div>
</body>
</html>
