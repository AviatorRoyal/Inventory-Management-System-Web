<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Shree Dwarka Agency</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(to right, #dbeafe, #fef9c3);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
        }

        .title-container {
            text-align: center;
            margin-top: 30px;
        }

        .title-container h1 {
            font-size: 2.5rem;
            color: #1e3a8a;
            margin-bottom: 0.2em;
        }

        .title-container h2 {
            font-size: 1.5rem;
            color: #475569;
            font-weight: 400;
            margin-top: 0;
        }

        .login-box {
            margin-top: 50px;
            background: #ffffff;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
        }

        .login-box h3 {
            text-align: center;
            margin-bottom: 1.5em;
            color: #1e293b;
            font-size: 1.75rem;
        }

        .login-box form {
            display: flex;
            flex-direction: column;
        }

        .login-box input {
            padding: 12px 15px;
            margin-bottom: 1em;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
        }

        .login-box button {
            padding: 12px;
            background-color: #1d4ed8;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .login-box button:hover {
            background-color: #1e40af;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }

        .password-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-container input {
            width: 100%;
            padding-right: 40px; /* space for the icon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 40%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 1.8rem;
            user-select: none;
        }


        @media (max-width: 480px) {
            .title-container h1 {
                font-size: 2rem;
            }

            .title-container h2 {
                font-size: 1.2rem;
            }

            .login-box {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>Shree Dwarka Agency</h1>
        <h2>Inventory Management System</h2>
    </div>

    <div class="login-box">
        <h3>Login Page</h3>
        <form action="{{ url_for('do_login') }}" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <div class="password-container">
                <input type="password" name="password" id="password" placeholder="Password" required>
                <span class="toggle-password" onclick="togglePassword()">👁️</span>
            </div>
            <button type="submit">Login</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
<script>
function togglePassword() {
    const pwdField = document.getElementById("password");
    const icon = document.querySelector(".toggle-password");
    if (pwdField.type === "password") {
        pwdField.type = "text";
        icon.textContent = "🙈";
    } else {
        pwdField.type = "password";
        icon.textContent = "👁️";
    }
}
</script>

</body>
</html>
